events {}

http {
    # Use Docker's embedded DNS resolver so upstream IPs refresh
    # when containers restart and get new addresses.
    resolver 127.0.0.11 valid=5s;
    resolver_timeout 3s;

    upstream api {
        server api_1:8000;
        server api_2:8000;
        server api_3:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
