services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api_1
      - api_2
      - api_3
    restart: unless-stopped

  api_1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_ID: "1"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: q
      POSTGRES_USER: q
      POSTGRES_PASSWORD: q
      REDIS_NODES: "redis_1:6379,redis_2:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis_1:
        condition: service_healthy
      redis_2:
        condition: service_healthy
    restart: unless-stopped

  api_2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_ID: "2"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: q
      POSTGRES_USER: q
      POSTGRES_PASSWORD: q
      REDIS_NODES: "redis_1:6379,redis_2:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis_1:
        condition: service_healthy
      redis_2:
        condition: service_healthy
    restart: unless-stopped

  api_3:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_ID: "3"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: q
      POSTGRES_USER: q
      POSTGRES_PASSWORD: q
      REDIS_NODES: "redis_1:6379,redis_2:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis_1:
        condition: service_healthy
      redis_2:
        condition: service_healthy
    restart: unless-stopped

  click_consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: q
      POSTGRES_USER: q
      POSTGRES_PASSWORD: q
      REDIS_NODES: "redis_1:6379,redis_2:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis_1:
        condition: service_healthy
    restart: unless-stopped

  redis_1:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis_2:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: q
      POSTGRES_USER: q
      POSTGRES_PASSWORD: q
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U q -d q"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
